<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeritaVault — Trình dựng tour 360°</title>
<link rel="stylesheet" href="vendor/pannellum.css">
<style>
  :root{ --do:#7a1f1f; --vang:#c79a3a; --bg:#15100c; --pan:#221913; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#f3ece0;font-size:13px}
  #app{display:grid;grid-template-columns:230px 1fr 270px;grid-template-rows:46px 1fr;height:100vh}
  #top{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 14px;background:#0e0a07;border-bottom:1px solid #3a2c1e}
  #top b{color:var(--vang)} #top .sp{flex:1}
  #top button,#top a{font:inherit;cursor:pointer;border:1px solid var(--vang);background:transparent;color:var(--vang);
    padding:5px 11px;border-radius:7px;text-decoration:none}
  #st{font-size:12px;opacity:.85}
  .col{overflow-y:auto;padding:12px}
  #left{background:var(--pan);border-right:1px solid #3a2c1e}
  #right{background:var(--pan);border-left:1px solid #3a2c1e}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--vang);margin:0 0 8px}
  .scene{display:flex;align-items:center;gap:4px;padding:6px 7px;border-radius:7px;margin-bottom:4px;
    background:rgba(0,0,0,.25);border:1px solid transparent;cursor:pointer}
  .scene.sel{border-color:var(--vang);background:rgba(122,31,31,.55)}
  .scene .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scene .star{opacity:.35} .scene .star.on{opacity:1;color:var(--vang)}
  .scene .mini{border:0;background:transparent;color:#caa;cursor:pointer;font-size:12px;padding:1px 3px}
  .scene .mini:hover{color:#fff}
  #center{position:relative;background:#000}
  #pano{position:absolute;inset:0}
  #empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#9c8;padding:30px}
  body.placing #pano{cursor:crosshair}
  .btn{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;margin-bottom:6px;
    border:1px solid var(--vang);background:rgba(199,154,58,.12);color:#f3ece0;padding:8px 10px;border-radius:8px}
  .btn:hover{background:rgba(199,154,58,.25)}
  .hs{display:flex;align-items:center;gap:5px;padding:6px 7px;border-radius:7px;margin-bottom:4px;background:rgba(0,0,0,.25)}
  .hs .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hs .mini{border:0;background:transparent;color:#caa;cursor:pointer;padding:2px 4px}
  .hs .mini:hover{color:#fff}
  select,input[type=text]{font:inherit;width:100%;padding:6px;border-radius:7px;border:1px solid #5a4530;background:#120d09;color:#fff;margin-bottom:6px}
  .pnlm-hotspot.info-do{background:var(--do);border:2px solid var(--vang)}
  .note{font-size:11.5px;opacity:.7;line-height:1.5;margin-top:10px}
  .pend{background:rgba(199,154,58,.18);border:1px dashed var(--vang);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;display:none}
  /* ===== Modal sửa nội dung dài ===== */
  #mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  #mbg.on{display:flex}
  #mbox{background:#221913;border:1px solid var(--vang);border-radius:12px;
    width:min(640px,calc(100vw - 30px));max-height:calc(100vh - 60px);
    display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  #mbox h3{margin:0;padding:14px 16px 8px;color:var(--vang);font-size:14px;border-bottom:1px solid #3a2c1e}
  #mbox textarea{flex:1;min-height:240px;margin:12px 16px;padding:10px 12px;border-radius:8px;
    border:1px solid #5a4530;background:#120d09;color:#f3ece0;font:inherit;font-size:13.5px;line-height:1.55;resize:vertical}
  #mbox .mft{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 14px;gap:10px;border-top:1px solid #3a2c1e}
  #mbox .mcount{font-size:11.5px;opacity:.7}
  #mbox .mbtns{display:flex;gap:8px}
  #mbox .mbtns button{font:inherit;cursor:pointer;border-radius:8px;padding:7px 14px;border:1px solid var(--vang)}
  #mbox .mok{background:var(--vang);color:#241a10;font-weight:700}
  #mbox .mcc{background:transparent;color:var(--vang)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <b>🏛️ HeritaVault — Trình dựng tour</b>
    <button onclick="editMeta()">✎ Tên di tích</button>
    <span class="sp"></span>
    <span id="st">Đang tải…</span>
    <a href="index.html" target="_blank">▶ Xem tour</a>
  </div>

  <div id="left" class="col">
    <h2>Điểm (cảnh)</h2>
    <button class="btn" onclick="addScene()">➕ Thêm điểm từ ảnh</button>
    <div id="scenes"></div>
    <div class="note">Bấm tên để mở. ★ = điểm mở đầu. ↑↓ đổi thứ tự. ✎ đổi tên. 🗑 xoá.</div>
  </div>

  <div id="center">
    <div id="pano"></div>
    <div id="empty">Chưa có điểm nào.<br>Bấm <b>➕ Thêm điểm từ ảnh</b> bên trái để bắt đầu.<br>
      <span class="note">(Đặt ảnh 360° đã nén vào thư mục <code>panos/</code> trước.)</span></div>
  </div>

  <div id="right" class="col">
    <h2>Lối đi & chú thích</h2>
    <div id="pend" class="pend"></div>
    <select id="target"></select>
    <button class="btn" onclick="startNewLink()">➕ Thêm lối đi sang điểm đã chọn</button>
    <button class="btn" onclick="startNewInfo()">➕ Thêm điểm chú thích</button>
    <div id="hslist" style="margin-top:10px"></div>
  </div>
</div>

<div id="mbg">
  <div id="mbox">
    <h3 id="mtitle">Nội dung chú thích</h3>
    <textarea id="mtext" spellcheck="false"></textarea>
    <div class="mft">
      <span class="mcount" id="mcount">0 ký tự</span>
      <div class="mbtns">
        <button class="mcc" id="mcancel">Huỷ</button>
        <button class="mok" id="msave">💾 Lưu nội dung</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/pannellum.js"></script>
<script>
let DATA, viewer, cur=null, pend=null, downX=0, downY=0;
const $=id=>document.getElementById(id);
const st=$("st"), pano=$("pano");

/* ---------- Tải dữ liệu (kèm báo lỗi rõ ra màn hình) ---------- */
window.addEventListener("error", e => flash("⚠ JS Lỗi: " + e.message));
fetch("tour.json?t=" + Date.now())   // chống cache
  .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(d => {
    DATA = d;
    if(!DATA.order) DATA.order=[]; if(!DATA.names) DATA.names={}; if(!DATA.scenes) DATA.scenes={};
    cur = DATA.first || DATA.order[0] || null;
    flash("Đã tải " + DATA.order.length + " điểm. Đang dựng…");
    renderScenes();
    try { rebuild(); flash("✓ Sẵn sàng — " + DATA.order.length + " điểm"); }
    catch(e) { flash("⚠ Lỗi dựng tour: " + e.message); console.error(e); }
  })
  .catch(err => {
    DATA = {title:"Di tích mới", subtitle:"", first:null, order:[], names:{}, scenes:{}};
    renderScenes(); rebuild();
    flash("⚠ Lỗi tải tour.json: " + err.message);
    console.error(err);
  });

/* ---------- Lưu ---------- */
function save(){ st.textContent="Đang lưu…";
  fetch("/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(DATA)})
    .then(r=> st.textContent = r.ok?"✓ Đã lưu":"⚠ Lỗi lưu")
    .catch(()=> st.textContent="⚠ Chưa chạy serve.py — chưa lưu được"); }
function flash(m){ st.textContent=m; }

/* ---------- Modal sửa nội dung dài ---------- */
function editText(title, initial, onSave){
  $("mtitle").textContent=title;
  const ta=$("mtext"); ta.value=initial||"";
  const upd=()=>$("mcount").textContent = ta.value.length + " ký tự";
  upd(); ta.oninput=upd;
  $("mbg").classList.add("on");
  setTimeout(()=>ta.focus(),60);
  const close=()=>{ $("mbg").classList.remove("on"); $("msave").onclick=null; $("mcancel").onclick=null; ta.oninput=null; };
  $("msave").onclick=()=>{ const v=ta.value; close(); onSave(v); };
  $("mcancel").onclick=close;
}

/* ---------- Pannellum ---------- */
function hsCfg(h){ const o={id:h.id,type:h.type,yaw:h.yaw,pitch:h.pitch};
  if(h.type==="scene"){ o.sceneId=h.sceneId; o.text=h.text||DATA.names[h.sceneId]||h.sceneId; }
  else { o.text=h.text; o.cssClass="pnlm-hotspot info-do"; } return o; }
function rebuild(){
  if(viewer){ try{viewer.destroy();}catch(e){} viewer=null; }
  const has = DATA.order.length>0 && cur && DATA.scenes[cur];
  $("empty").style.display = has?"none":"grid";
  if(!has){ renderHs(); return; }
  const scenes={};
  for(const id of DATA.order){ const s=DATA.scenes[id];
    scenes[id]={title:DATA.names[id],panorama:s.panorama,hotSpots:s.hotSpots.map(hsCfg)}; }
  viewer=pannellum.viewer("pano",{default:{firstScene:cur,autoLoad:true,compass:true,sceneFadeDuration:0},scenes});
  viewer.on("mousedown",e=>{});
  viewer.on("scenechange",id=>{ cur=id; renderScenes(); renderHs(); });
  renderHs();
}

/* ---------- Cột trái: danh sách điểm ---------- */
function renderScenes(){
  const box=$("scenes"); box.innerHTML="";
  DATA.order.forEach((id,i)=>{
    const row=document.createElement("div"); row.className="scene"+(id===cur?" sel":"");
    row.innerHTML='<span class="star'+(id===DATA.first?" on":"")+'" title="Đặt làm điểm mở đầu">★</span>'+
      '<span class="nm">'+(i+1)+'. '+esc(DATA.names[id])+'</span>'+
      '<button class="mini" title="Lên">↑</button><button class="mini" title="Xuống">↓</button>'+
      '<button class="mini" title="Đổi tên">✎</button>'+
      '<button class="mini" title="Đổi ảnh (sửa nhầm ảnh)">🖼</button>'+
      '<button class="mini" title="Xoá">🗑</button>';
    const [up,down,ren,img,del]=row.querySelectorAll("button");
    row.querySelector(".nm").onclick=()=>{ cur=id; renderScenes(); rebuild(); };
    row.querySelector(".star").onclick=()=>{ DATA.first=id; save(); renderScenes(); };
    up.onclick=e=>{e.stopPropagation(); if(i>0){ swap(i,i-1); } };
    down.onclick=e=>{e.stopPropagation(); if(i<DATA.order.length-1){ swap(i,i+1); } };
    ren.onclick=e=>{e.stopPropagation(); const n=prompt("Tên điểm:",DATA.names[id]); if(n){DATA.names[id]=n.trim();save();renderScenes();rebuild();} };
    img.onclick=e=>{ e.stopPropagation();
      fetch("/panos").then(r=>r.json()).then(files=>{
        const curFile=(DATA.scenes[id].panorama||"").replace("panos/","");
        const pick=prompt("Đổi ảnh cho điểm \""+DATA.names[id]+"\"\n\nẢnh đang dùng: "+curFile+"\n\nGõ tên ảnh khác trong panos/:\n"+files.join("  "), curFile);
        if(!pick) return; const file=pick.trim();
        if(!files.includes(file)){ alert("Không có file: "+file); return; }
        DATA.scenes[id].panorama="panos/"+file; save(); rebuild(); flash("Đã đổi ảnh: "+file);
      }).catch(()=>alert("Không lấy được danh sách ảnh."));
    };
    del.onclick=e=>{e.stopPropagation(); delScene(id); };
    box.appendChild(row);
  });
}
function swap(a,b){ const o=DATA.order; [o[a],o[b]]=[o[b],o[a]]; save(); renderScenes(); }

/* ---------- Thêm / xoá điểm ---------- */
function addScene(){
  fetch("/panos").then(r=>r.json()).then(files=>{
    const used=new Set(DATA.order.map(id=>DATA.scenes[id].panorama.replace("panos/","")));
    const free=files.filter(f=>!used.has(f));
    if(!files.length){ alert("Thư mục panos/ chưa có ảnh nào. Hãy bỏ ảnh 360° (đã nén) vào panos/ rồi thử lại."); return; }
    const pick=prompt("Chọn ảnh cho điểm mới (gõ đúng tên file):\n\nCòn trống:\n"+(free.join("\n")||"(đã dùng hết)")+"\n\nTất cả:\n"+files.join("\n"), free[0]||files[0]);
    if(!pick) return; const file=pick.trim();
    if(!files.includes(file)){ alert("Không thấy file: "+file); return; }
    const name=prompt("Tên điểm (ví dụ: Hậu cung):","Điểm "+(DATA.order.length+1));
    if(name===null) return;
    let n=1; while(DATA.scenes["s"+n]) n++; const id="s"+n;
    DATA.scenes[id]={panorama:"panos/"+file,hotSpots:[]}; DATA.names[id]=name.trim()||id; DATA.order.push(id);
    if(!DATA.first) DATA.first=id; cur=id; save(); renderScenes(); rebuild();
  }).catch(()=>alert("Không lấy được danh sách ảnh. serve.py đã chạy chưa?"));
}
function delScene(id){
  if(!confirm("Xoá điểm \""+DATA.names[id]+"\"? Các lối đi trỏ tới nó cũng bị gỡ.")) return;
  delete DATA.scenes[id]; delete DATA.names[id];
  DATA.order=DATA.order.filter(x=>x!==id);
  for(const s in DATA.scenes) DATA.scenes[s].hotSpots=DATA.scenes[s].hotSpots.filter(h=>h.sceneId!==id);
  if(DATA.first===id) DATA.first=DATA.order[0]||null;
  if(cur===id) cur=DATA.order[0]||null;
  save(); renderScenes(); rebuild();
}

/* ---------- Cột phải: lối đi & chú thích ---------- */
function renderHs(){
  const sel=$("target"); sel.innerHTML="";
  DATA.order.filter(id=>id!==cur).forEach(id=>{ const o=document.createElement("option"); o.value=id; o.textContent=DATA.names[id]; sel.appendChild(o); });
  const box=$("hslist"); box.innerHTML="";
  if(!cur||!DATA.scenes[cur]) return;
  DATA.scenes[cur].hotSpots.forEach(h=>{
    const row=document.createElement("div"); row.className="hs";
    let label;
    if(h.type==="scene"){
      const def=DATA.names[h.sceneId]||h.sceneId;
      label = h.text ? ("➜ "+h.text+" (gốc: "+def+")") : ("➜ "+def);
    } else {
      label = "ℹ "+(h.text||"").slice(0,28);
    }
    row.innerHTML='<span class="lbl">'+esc(label)+'</span>'+
      '<button class="mini" title="Di chuyển">✥</button>'+
      '<button class="mini" title="Sửa chữ trên mũi tên/chú thích">✎</button>'+
      '<button class="mini" title="Xoá">🗑</button>';
    const btns=row.querySelectorAll("button");
    btns[0].onclick=()=>startMove(h.id);
    btns[1].onclick=()=>{
      if(h.type==="scene"){
        const def=DATA.names[h.sceneId]||h.sceneId;
        const t=prompt("Chữ riêng cho mũi tên (để trống = dùng tên điểm đích \""+def+"\"):", h.text||"");
        if(t===null) return;
        const v=t.trim(); if(v) h.text=v; else delete h.text;
      } else {
        editText("Sửa nội dung chú thích cho \""+(DATA.names[cur]||cur)+"\"", h.text||"", v=>{
          h.text=v; save(); rebuild();
        });
        return;
      }
      save(); rebuild();
    };
    btns[2].onclick=()=>delHs(h.id);
    box.appendChild(row);
  });
}
function delHs(hid){ DATA.scenes[cur].hotSpots=DATA.scenes[cur].hotSpots.filter(h=>h.id!==hid); save(); rebuild(); }
function newHsId(){ let n=1; const ids=new Set(DATA.scenes[cur].hotSpots.map(h=>h.id)); while(ids.has("h"+n))n++; return "h"+n; }

/* ---------- Đặt vị trí (bấm lên ảnh) ---------- */
function setPend(p,msg){ pend=p; document.body.classList.toggle("placing",!!p);
  const el=$("pend"); el.style.display=p?"block":"none"; el.textContent=msg||""; }
function startNewLink(){ if(!cur)return alert("Chưa có điểm."); const t=$("target").value;
  if(!t)return alert("Cần ít nhất 2 điểm để nối."); setPend({kind:"link",target:t},"Bấm lên ảnh nơi đặt lối đi → "+DATA.names[t]); }
function startNewInfo(){ if(!cur)return alert("Chưa có điểm.");
  editText("Nhập nội dung chú thích mới cho \""+(DATA.names[cur]||cur)+"\"", "", v=>{
    const txt=(v||"").trim(); if(!txt) return;
    setPend({kind:"info",text:txt},"Bấm lên ảnh nơi đặt chú thích");
  });
}
function startMove(hid){ setPend({kind:"move",id:hid},"Bấm lên ảnh để di chuyển nút tới đó"); }

pano.addEventListener("mousedown",e=>{downX=e.clientX;downY=e.clientY;});
pano.addEventListener("mouseup",e=>{
  if(!pend||!viewer) return;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;   // đang xoay ảnh
  const c=viewer.mouseEventToCoords(e); const pitch=Math.round(c[0]*10)/10, yaw=Math.round(c[1]*10)/10;
  const hs=DATA.scenes[cur].hotSpots;
  if(pend.kind==="link") hs.push({id:newHsId(),type:"scene",sceneId:pend.target,yaw,pitch});
  else if(pend.kind==="info") hs.push({id:newHsId(),type:"info",text:pend.text,yaw,pitch});
  else if(pend.kind==="move"){ const h=hs.find(x=>x.id===pend.id); if(h){h.yaw=yaw;h.pitch=pitch;} }
  setPend(null); save(); rebuild();
});

/* ---------- Tên di tích ---------- */
function editMeta(){ const t=prompt("Tên di tích (hiện trên tour):",DATA.title||""); if(t===null)return;
  const s=prompt("Dòng mô tả phụ:",DATA.subtitle||""); if(s===null)return;
  DATA.title=t.trim(); DATA.subtitle=s.trim(); save(); flash("Đã đổi tên di tích"); }

function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
</script>
</body>
</html>
